<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>HokeGo Quiz｜保健テスト対策</title>
<link rel="stylesheet" href="css/styles.css">
</head><body class="splash-active">
<div id="hokegoSplash" aria-label="HokeGo 起動画面">
  <img class="opening-app-icon" src="assets/image_01.png" alt="HokeGo アプリアイコン">
</div>
 <div class="header-characters"><img id="heroBoy" alt="冒険者の男の子"><img id="heroGirl" alt="案内役の女の子"></div>
</header>
<main>
<section id="home" class="portal-home image-home">
 <div class="home-artwork-frame" id="homeArtworkFrame">
  <img class="home-artwork-img" id="homeArtworkImage" alt="HokeGo ホーム画面">
  <button class="home-hotspot hotspot-materials" type="button" aria-label="授業資料" onclick="openMaterials()"></button>
  <button class="home-hotspot hotspot-quiz" type="button" aria-label="クイズ" onclick="openQuiz()"></button>
  <button class="home-hotspot hotspot-admin" type="button" aria-label="管理画面" onclick="openAdminLogin()"></button>
 </div>
 <img id="portalBoy" hidden alt=""><img id="portalGirl" hidden alt="">
</section>
<section id="adminLogin" class="hidden">
 <div class="admin-dashboard-gate">
  <img class="admin-dashboard-background" src="assets/image_02.jpg" alt="HokeGo 管理画面">
  <div class="admin-dashboard-shade" aria-hidden="true"></div>
  <div class="admin-login-modal" role="dialog" aria-modal="true" aria-labelledby="adminGateTitle">
   <div class="admin-login-modal-crest">♜</div>
   <div class="admin-login-modal-kicker">HOKeGO · SECRET COMMAND ROOM</div>
   <h1 id="adminGateTitle">管理者ログイン</h1>
   <p class="admin-login-modal-sub">秘密の指令室に入室します</p>
   <label for="adminEmail">メールアドレス</label>
   <input id="adminEmail" type="email" autocomplete="username" placeholder="登録済みのメールアドレス">
   <label for="adminPassword">パスワード</label>
   <input id="adminPassword" type="password" autocomplete="current-password" placeholder="パスワードを入力">
   <button type="button" class="admin-modal-submit" id="adminSubmitButton" onclick="submitAdminLogin()">ログイン</button>
   <button type="button" class="admin-register-toggle" id="adminRegisterToggle" onclick="toggleAdminRegister()">初めて利用する場合：管理者パスワードを登録</button>
   <p id="adminLoginMessage" class="admin-login-message" aria-live="polite"></p>
   <button type="button" class="admin-modal-home" onclick="goPortal()">ホームへ戻る</button>
  </div>
 </div>
</section>
<section id="adminDashboard" class="hidden">
 <div class="admin-dashboard-live">
  <img class="admin-dashboard-art" src="assets/image_02.jpg" alt="管理画面・運営のための指令室">
  <button class="admin-dash-home" type="button" onclick="goPortal()" aria-label="ホームへ戻る"></button>
  <button class="admin-dash-tile tile-users" type="button" onclick="openAdminModule('users')" aria-label="ユーザー管理"></button>
  <button class="admin-dash-tile tile-questions" type="button" onclick="openAdminModule('questions')" aria-label="問題データ管理"></button>
  <button class="admin-dash-tile tile-materials" type="button" onclick="openAdminModule('materials')" aria-label="授業資料の管理"></button>
  <button class="admin-dash-tile tile-settings" type="button" onclick="openAdminModule('settings')" aria-label="システム設定"></button>
  <button class="admin-dash-tile tile-backup" type="button" onclick="openAdminModule('backup')" aria-label="データの保存・復元"></button>
  <button class="admin-dash-tile tile-usage" type="button" onclick="openAdminModule('usage')" aria-label="利用状況の確認"></button>
  <div id="adminModulePanel" class="admin-module-panel hidden" role="dialog" aria-modal="true">
   <div class="admin-module-top"><span id="adminModuleTitle">管理メニュー</span><button type="button" onclick="closeAdminModule()" aria-label="閉じる">×</button></div>
   <div id="adminModuleBody" class="admin-module-body"></div>
   <button type="button" class="admin-module-back" onclick="closeAdminModule()">管理画面に戻る</button>
  </div>
 </div>
</section>
<section id="materials" class="hidden">
 <div class="materials-title-plaque" aria-label="授業資料・知識の森のクエスト">
      <span class="materials-title-emblem">✦</span>
      <span class="materials-title-copy"><strong>授業資料</strong><small>知識の森のクエスト</small></span>
      <span class="materials-title-leaf">❧</span>
    </div>
 <button type="button" class="materials-home-hotspot shared-home-button" onclick="goPortal()">⌂ ホーム</button>
 <div class="materials-wrap">
  <div class="materials-heading"><div class="materials-kicker">HOKeGO · CLASS MATERIALS</div><h1>授業資料</h1><p>授業ごとに資料をまとめています。PDFはここで閲覧できます。</p></div>
  <div id="lessonMaterials" class="lesson-list"></div>
  <div class="materials-note">資料は授業回ごとに追加されます。PDF・PowerPointのダウンロードに対応します。</div>
  <div class="materials-nav"><button class="btn secondary" onclick="goPortal()">← ホームへ戻る</button></div>
 </div>
</section>
<section id="quizHome" class="hidden">
 <div class="castle-quest-screen">
  <img class="castle-quest-art" src="assets/image_03.jpg" alt="城塞でのクエスト">
  <div class="castle-hotspots">
   <button class="castle-home-hotspot" type="button" aria-label="ホームへ戻る" onclick="goPortal()"></button>
   <button class="field-hotspot field-1" type="button" aria-label="第1分野" onclick="showFieldUnits(0)"></button>
   <button class="field-hotspot field-2" type="button" aria-label="第2分野" onclick="showFieldUnits(1)"></button>
   <button class="field-hotspot field-3" type="button" aria-label="第3分野" onclick="showFieldUnits(2)"></button>
   <button class="field-hotspot field-4" type="button" aria-label="第4分野" onclick="showFieldUnits(3)"></button>
   <button class="castle-random-action" type="button" onclick="startRandom()">⚔ ランダムに挑む</button>
   <button class="castle-weak-action" type="button" onclick="startWeak()">📖 苦手問題</button>
  </div>
  <div id="fieldUnitPanel" class="field-unit-panel hidden">
   <div class="field-unit-panel-head">
    <button type="button" class="field-back-button" onclick="showFieldMenu()">‹ 分野選択に戻る</button>
    <div id="fieldUnitTitle" class="field-unit-title"></div>
    <div id="fieldUnitCount" class="field-unit-count"></div>
   </div>
   <div id="fieldUnitScroll" class="field-unit-scroll"></div>
  </div>
 </div>
</section>
<section id="quiz" class="hidden">
 <div class="quest-play">
  <div class="quiz-home-nav"><button type="button" class="quiz-home-button shared-home-button" onclick="goPortal()">⌂ ホーム</button></div>
  <div class="quest-topline">
   <div class="wood-plaque"><span id="quizUnit"></span></div>
   <div class="progress-plaque"><div class="progress-track"><i id="progress"></i></div><span class="star-mark">★</span><strong id="counter"></strong></div>
  </div>
  <div class="question-frame">
   <div class="level-medal"><span class="medal-stars">★★★</span><strong id="level">基礎</strong><small>LEVEL</small></div>
   <div class="talk boy-talk" id="boyTalk">考えてみよう！</div>
   <div class="talk girl-talk" id="girlTalk">わかるかな？</div>
   <div class="question-spark spark-one">✦</div><div class="question-spark spark-two">✧</div>
   <img class="quiz-character quiz-boy" id="quizBoy" alt="冒険者の男の子">
   <img class="quiz-character quiz-girl" id="quizGirl" alt="案内役の女の子">
   <div class="question" id="question"></div>
  </div>
  <div class="choices" id="choices"></div>
  <div id="feedback" class="hidden"></div>
  <div class="quest-bottom">
   <button class="btn ghost back-quest" onclick="goHome()">↩</button>
   <button id="nextBtn" class="btn primary hidden" onclick="nextQuestion()">次の問題へ　➜</button>
  </div>
 </div>
</section>
<section id="result" class="hidden">
 <div class="panel"><div class="resultbig"><span class="tag">RESULT</span><b id="score"></b><div id="resultText"></div></div><div class="stats"><div class="stat"><b id="rightNum">0</b><span>正解</span></div><div class="stat"><b id="wrongNum">0</b><span>不正解</span></div><div class="stat"><b id="rateNum">0%</b><span>正答率</span></div></div></div>
 <div class="panel"><h2>今回の振り返り</h2><div id="review"></div></div>
 <div class="actions"><button class="btn primary" onclick="retryWrong()">間違えた問題を復習</button><button class="btn secondary" onclick="goHome()">ホームへ戻る</button></div>
</section>
</main><footer>HokeGo Quiz prototype · 問題データは今後追加・修正できます</footer>

<script src="js/app.js"></script>

<script>
/* 起動画面のフェイルセーフ：アプリ本体でエラーが起きても起動画面に閉じ込めない */
(function(){
  function releaseSplash(){
    var splash=document.getElementById('hokegoSplash');
    if(splash){
      splash.classList.add('is-hidden');
      window.setTimeout(function(){if(splash.parentNode)splash.parentNode.removeChild(splash);},650);
    }
    document.body.classList.remove('splash-active','opening-active','opening-home-zoom');
    var home=document.getElementById('home');
    if(home && !home.classList.contains('hidden')) home.style.removeProperty('display');
  }
  window.setTimeout(releaseSplash,5000);
  window.addEventListener('error',function(){window.setTimeout(releaseSplash,1200);});
  window.addEventListener('unhandledrejection',function(){window.setTimeout(releaseSplash,1200);});
})();
</script>

</body></html>
